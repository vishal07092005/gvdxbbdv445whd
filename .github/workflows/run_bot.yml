name: High Speed TG Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

# 🛡️ EK WAQT PAR SIRF EK BOT INSTANCE CHALEGA
concurrency:
  group: tg-bot-runner
  cancel-in-progress: true

permissions:
  contents: write  # Database file (users_db.json) ko repo me auto-save karne ke liye

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Aria2c & High-Speed Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg aria2
          pip install -U pip
          pip install -U yt-dlp kurigram tgcrypto uvloop

      - name: Run Pro Telegram Bot (With Auto DB Sync)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "Bot Auto-DB"
          git config user.email "bot@users.noreply.github.com"

          # Har 10 minute me users_db.json ko GitHub par auto-save karega
          (
            while true; do
              sleep 600
              if [ -f users_db.json ]; then
                git add users_db.json
                git diff --staged --quiet || (git commit -m "📊 Auto-sync users_db.json [skip ci]" && git pull --rebase origin main && git push origin main || true)
              fi
            done
          ) &

          python -u bot.py

      - name: Final Database Save on Stop/Timeout
        if: always()
        run: |
          if [ -f users_db.json ]; then
            git config user.name "Bot Auto-DB"
            git config user.email "bot@users.noreply.github.com"
            git add users_db.json
            git diff --staged --quiet || (git commit -m "📊 Final sync users_db.json [skip ci]" && git pull --rebase origin main && git push origin main || true)
          fi
