name: High Speed TG Bot

on:
  workflow_dispatch: # Manual Start Button
  schedule:
    - cron: '0 */5 * * *' # Har 5 ghante me auto-restart

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install FFmpeg, Aria2c & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2
          pip install -U yt-dlp pyrogram tgcrypto

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          timeout 5h 40m python3 bot.py || true
